<!-- shop/templates/shop/add_to_cart.html -->
{% extends "base.html" %}

{% block content %}
<h1>Добавить "{{ product.name }}" в корзину</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Добавить в корзину</button>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
