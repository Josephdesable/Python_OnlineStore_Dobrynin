<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'product_list' %}">🏪 Магазин</a>
            <span class="navbar-text">
                <a href="{% url 'product_list' %}">Главная</a> | 
                {% if user.is_authenticated %}
                    <a href="{% url 'order_list' %}">Мои заказы</a> | 
                    <form method="post" action="{% url 'logout' %}" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link p-0 text-decoration-none border-0">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                {% endif %}
                <a href="/admin/">Админка</a>
            </span>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="mt-5 py-3 bg-light text-center">
        <div class="container">
            <p class="mb-0">&copy; 2025 Мой магазин. Все товары подлинные!</p>
        </div>
    </footer>
</body>
</html>
